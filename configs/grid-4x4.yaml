# Sixteen zones on a 4 x 4 grid; every neighbour pair shares quake and rain streams.
# Largest grid with an exact loss law here (the sweep frontier grows as 10^(rows+1)).
name: grid-4x4
model: grid_sources
perils:
  quake: {limit: 70.0e6, steps: 4}
  rain: {limit: 10.0e6, annual_prob: 0.02, shared_share: 0.25}
term_years: 3
dependence: {type: grid, rows: 4, cols: 4}
targets: ["E[L]", "P(L>T3)", "P(L>T5)", "stop-loss", "VaR95", "CVaR95", "VaR99", "CVaR99"]
accuracy: {rel_rmse: 0.01}
seed: 16
