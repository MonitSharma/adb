# Digital twin of the brief's portfolio: certified answers, a dependence sweep,
# a structure comparison and conditional tail scenarios, all with a query ledger.
name: twin-adb-base
portfolio: adb-base.yaml           # a two_country config (relative to this file)
confidence: 0.99
interval: ch                       # ch = Chernoff-Hoeffding (default); cp = Clopper-Pearson, fewer queries but
                                   # its rare misses can be confidently wrong (results/twin_intervals.md)
half_width: 0.05                   # certified answers: relative half-width
targets: ["P(both pay)", "P(L>T)", "stop-loss", "P(both exhausted)"]
sweep:
  parameter: quake_mult            # shared-earthquake multiplier (1 = the brief)
  from: 0.5
  to: 1.5
  step: 0.05
  half_width: 0.10
  targets: ["P(both pay)", "P(both exhausted)"]
structures:
  metric: stop-loss                # stop-loss above the threshold
  quake_limits_musd: [55, 60, 65, 70]   # earthquake sub-limit; rain gets the rest of USD 80m
library:
  event: "P(both exhausted)"
  size: 200
  along_quake_mult: [1.2, 1.5]
seed: 7
