[project]
name = "adbq"
version = "0.1.0"
description = "Quantum amplitude estimation for joint catastrophe-bond losses (ADB Quantum Challenge)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
quantum = ["qiskit>=2.1,<3", "qiskit-aer>=0.17", "pytket>=2.0", "pytket-qiskit>=0.70", "pytket-quantinuum>=0.50"]

[project.scripts]
adbq = "adbq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running checks (run with: pytest -m slow)"]
addopts = "-m 'not slow'"
